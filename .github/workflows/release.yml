name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1; the version bundled with
      # setup-node's Node 22 can lag behind that.
      - run: npm install -g npm@12
      - run: npm ci
      - name: Verify the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - run: npm publish --access public
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md for details." --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
