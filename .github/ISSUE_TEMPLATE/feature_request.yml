name: Feature request
description: Propose a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. API sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
