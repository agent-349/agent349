name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues must not be reported here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code and configuration that shows the problem. Remove secrets.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent349 version
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.9, Ubuntu 24.04
  - type: input
    id: provider
    attributes:
      label: Model provider(s) and storage backends involved
      placeholder: claude, redis
