# Vector stores for the adapter contract tests (tests/integration/vectorstores.test.ts).
#
#   docker compose -f tests/integration/vectorstores.compose.yml up -d
#   npm run test:vectorstores
#   docker compose -f tests/integration/vectorstores.compose.yml down -v
#
# Ports are offset from the defaults so they do not collide with local services.
name: agent349-vectorstores

services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent349
      POSTGRES_PASSWORD: agent349
      POSTGRES_DB: agent349
    ports: ['5433:5432']

  qdrant:
    image: qdrant/qdrant:latest
    ports: ['6333:6333']

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
    command: ['--host', '0.0.0.0', '--port', '8080', '--scheme', 'http']
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports: ['8089:8080', '50052:50051']

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ['milvus', 'run', 'standalone']
    security_opt: ['seccomp:unconfined']
    environment:
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports: ['19530:19530', '9091:9091']

  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    environment:
      PORT: '5080'
      PINECONE_HOST: localhost
    ports: ['5080-5090:5080-5090']

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: agent349-test-key
      MEILI_NO_ANALYTICS: 'true'
    ports: ['7701:7700']
